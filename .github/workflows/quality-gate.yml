name: Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [22, 24]
        include:
          - os: macos-latest
            node-version: 24
          - os: windows-latest
            node-version: 24

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # The Auditor-Executor protocol is an external dependency: the latest release from
      # PyPI, so CI catches a protocol change that breaks sdd-init or the Rigor gate.
      - name: Install auditkit (Auditor-Executor protocol CLI)
        run: pipx install auditor-executor-protocol

      - name: Run Framework Tests
        run: npm test

      - name: Execute Quality Gate Suite
        run: npm run quality-gate
