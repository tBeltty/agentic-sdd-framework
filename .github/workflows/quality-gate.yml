name: Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Verify Quality Gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install auditkit (Rigor mode checks)
        run: pipx install git+https://github.com/tBeltty/auditor-executor-protocol

      - name: Check out the canonical protocol repository
        uses: actions/checkout@v4
        with:
          repository: tBeltty/auditor-executor-protocol
          path: .canonical

      - name: Check vendored protocol files against the canonical repository
        run: node scripts/dev/sync-vendored.js .canonical --check

      - name: Run Framework Tests
        run: npm test

      - name: Execute Quality Gate Suite
        run: npm run quality-gate
