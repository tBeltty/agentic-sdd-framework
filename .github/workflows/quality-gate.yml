name: Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# The protocol release this framework vendors and tests against.
env:
  PROTOCOL_VERSION: v0.3.1

jobs:
  verify:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [22, 24]
        include:
          - os: macos-latest
            node-version: 24
          - os: windows-latest
            node-version: 24

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install auditkit (Rigor mode checks)
        run: pipx install git+https://github.com/tBeltty/auditor-executor-protocol@${{ env.PROTOCOL_VERSION }}

      - name: Check out the canonical protocol repository
        uses: actions/checkout@v4
        with:
          repository: tBeltty/auditor-executor-protocol
          ref: ${{ env.PROTOCOL_VERSION }}
          path: .canonical

      - name: Check vendored protocol files against the canonical repository
        run: node scripts/dev/sync-vendored.js .canonical --check

      - name: Run Framework Tests
        run: npm test

      - name: Execute Quality Gate Suite
        run: npm run quality-gate
