name: Publish to npm

on:
  push:
    tags:
      - 'v*'

# id-token: write is what lets npm trust this workflow run via OIDC instead of a
# stored token. No NPM_TOKEN secret exists or is needed.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm (trusted publishing needs npm 11.5.1 or newer)
        run: npm install -g npm@latest

      - name: Verify the tag matches package.json's version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Run Framework Tests
        run: npm test

      - name: Publish to npm
        run: npm publish
